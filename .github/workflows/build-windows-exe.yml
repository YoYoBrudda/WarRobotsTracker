name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --clean --noconfirm WarRobotsTracker.spec

      - name: Package EXE
        run: |
          mkdir release
          copy dist\WarRobotsTracker.exe release\WarRobotsTracker.exe
          copy README.md release\README.txt
          copy Install_Tesseract_Windows.ps1 release\Install_Tesseract_Windows.ps1
          Compress-Archive -Path release\* -DestinationPath WarRobotsTracker-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarRobotsTracker-Windows
          path: WarRobotsTracker-Windows.zip
